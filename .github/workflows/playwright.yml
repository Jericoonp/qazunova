name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Nightly regression run against staging (02:00 UTC daily).
  schedule:
    - cron: '0 2 * * *'
  # Allow manual, on-demand runs from the Actions tab.
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      LOGIN_PAGE_URL: ${{ secrets.LOGIN_PAGE_URL }}
      LOGIN_TEST_USER: ${{ secrets.LOGIN_TEST_USER }}
      LOGIN_TEST_PASSWORD: ${{ secrets.LOGIN_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - name: Upload Playwright report
        # Always keep the report on scheduled/manual runs (for the nightly record),
        # and on any failed push/PR run.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Upload failure screenshots & videos
        # Raw per-test screenshots, videos, and traces for quick access without
        # opening the full HTML report.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
