name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Regression run every 6 hours, starting 08:00 PHT (UTC+8).
  # 00:00/06:00/12:00/18:00 UTC == 08:00/14:00/20:00/02:00 PHT.
  schedule:
    - cron: '0 0,6,12,18 * * *'
  # Allow manual, on-demand runs from the Actions tab.
  workflow_dispatch:

jobs:
  notify-start:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Automation Logs – Tests started
        env:
          ZUNOU_WEBHOOK_URL: ${{ secrets.ZUNOU_WEBHOOK_URL }}
        run: |
          [ -z "$ZUNOU_WEBHOOK_URL" ] && exit 0
          curl -s -X POST "$ZUNOU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"▶ Playwright tests **started** — trigger: \`${{ github.event_name }}\`, run: [#${{ github.run_number }}](https://github.com/Jericoonp/qazunova/actions/runs/${{ github.run_id }})\"}" \
            || true

  test:
    needs: notify-start
    # Bumped from 30: the suite now runs 67 tests/browser (was ~35) with the
    # addition of tasks.spec.ts (32 tests, each paying its own full
    # login+onboarding cost against a slow staging backend -- see that
    # file's header comment). A live chromium run of just tasks.spec.ts
    # alone took ~33 minutes; 30 minutes total was already tight for the
    # rest of the suite (notes/login/dashboard/pulse) before this addition.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    strategy:
      # One browser's failure shouldn't cancel the other two mid-run.
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    env:
      LOGIN_PAGE_URL: ${{ secrets.LOGIN_PAGE_URL }}
      # Each browser shard authenticates as its own dedicated staging
      # account so parallel shards never mutate each other's data (notes.spec.ts
      # bulk-clears its account's notes in beforeAll, which otherwise races
      # across concurrently-running shards on a shared account).
      LOGIN_TEST_USER: ${{ matrix.project == 'firefox' && secrets.LOGIN_TEST_USER_FIREFOX || matrix.project == 'webkit' && secrets.LOGIN_TEST_USER_WEBKIT || secrets.LOGIN_TEST_USER }}
      LOGIN_TEST_PASSWORD: ${{ matrix.project == 'firefox' && secrets.LOGIN_TEST_PASSWORD_FIREFOX || matrix.project == 'webkit' && secrets.LOGIN_TEST_PASSWORD_WEBKIT || secrets.LOGIN_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browser (${{ matrix.project }})
        run: npx playwright install --with-deps ${{ matrix.project }}
      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload Playwright report
        # Always keep the report on scheduled/manual runs (for the nightly record),
        # and on any failed push/PR run.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30
      - name: Upload failure screenshots & videos
        # Raw per-test screenshots, videos, and traces for quick access without
        # opening the full HTML report.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

  notify-result:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Automation Logs – Tests completed
        env:
          ZUNOU_WEBHOOK_URL: ${{ secrets.ZUNOU_WEBHOOK_URL }}
          RESULT: ${{ needs.test.result }}
        run: |
          [ -z "$ZUNOU_WEBHOOK_URL" ] && exit 0
          if [ "$RESULT" = "success" ]; then ICON="✅"; else ICON="❌"; fi
          curl -s -X POST "$ZUNOU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"${ICON} Playwright tests **${RESULT}** (chromium · firefox · webkit) — trigger: \`${{ github.event_name }}\`, run: [#${{ github.run_number }}](https://github.com/Jericoonp/qazunova/actions/runs/${{ github.run_id }})\"}" \
            || true
