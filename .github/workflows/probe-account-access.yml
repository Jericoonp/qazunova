name: TM2-T014 account access probe

# Manual only. This never runs on push, PR or a schedule -- it is a diagnostic
# for one open question (does each account in PR #21's worker pool still reach a
# staging workspace?), not part of the regression suite.
on:
  workflow_dispatch:

jobs:
  probe:
    # The probe signs in as LOGIN_TEST_USER (slot 1), the same account the
    # chromium suite uses. It only READS, so it cannot wipe a live run's
    # fixtures -- but a concurrent login widens the pre-resolution "Access
    # Denied" window and would confound slot 1's result, so queue behind any
    # chromium run that adopts this group rather than racing it.
    concurrency:
      group: playwright-staging-chromium
      cancel-in-progress: false
    # Three logins with at most two 45s waits each; 15 minutes is ample. A cap
    # this low is deliberate -- an unresponsive staging must fail fast here, not
    # burn the suite's 90-minute budget.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      LOGIN_PAGE_URL: ${{ secrets.LOGIN_PAGE_URL }}
      LOGIN_TEST_USER: ${{ secrets.LOGIN_TEST_USER }}
      LOGIN_TEST_PASSWORD: ${{ secrets.LOGIN_TEST_PASSWORD }}
      LOGIN_TEST_USER_FIREFOX: ${{ secrets.LOGIN_TEST_USER_FIREFOX }}
      LOGIN_TEST_PASSWORD_FIREFOX: ${{ secrets.LOGIN_TEST_PASSWORD_FIREFOX }}
      LOGIN_TEST_USER_WEBKIT: ${{ secrets.LOGIN_TEST_USER_WEBKIT }}
      LOGIN_TEST_PASSWORD_WEBKIT: ${{ secrets.LOGIN_TEST_PASSWORD_WEBKIT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browser (chromium)
        run: npx playwright install --with-deps chromium
      - name: Probe every pool account
        # pipefail so the step's exit status is Playwright's, not tee's. The list
        # reporter prints incrementally, so the log survives even a killed run.
        # continue-on-error: a RED arm is this probe's finding, not its failure --
        # the run must still reach the upload steps below.
        continue-on-error: true
        run: |
          set -o pipefail
          npx playwright test --config playwright.probe.config.ts 2>&1 | tee probe-run.log
      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-account-access-log
          path: probe-run.log
          retention-days: 30
          if-no-files-found: ignore
      - name: Upload traces & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-account-access-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
