name: Playwright Tests

# ⚠️ THIS BRANCH'S COPY IS A PROBE, NOT THE SUITE. ⚠️
#
# `qa/tm2t014-account-access-probe` exists to answer one question: does each
# staging account in PR #21's worker pool still reach a workspace? (TM2-T014,
# parked 8 days on exactly this.) This file is deliberately NOT the regression
# suite -- it runs probe/account-access.spec.ts instead.
#
# WHY IT OVERWRITES playwright.yml RATHER THAN ADDING probe-account-access.yml:
# workflow_dispatch only registers workflows that exist on the DEFAULT branch.
# A new workflow file on a feature branch is invisible to `gh workflow run` --
# verified 2026-09-15, the API lists exactly one registered workflow here. But
# dispatching a REGISTERED workflow with `--ref <branch>` runs THAT BRANCH'S
# copy of the file. So the probe has to live at this path to be runnable at all.
#
# Nothing here reaches main: this branch has no PR and is not merge-intended.
#
#   gh workflow run playwright.yml --ref qa/tm2t014-account-access-probe
#
# -- MeQAtron

on:
  # Manual only. The automatic triggers are removed on purpose: this branch must
  # never run a scheduled or push-driven job, and a probe that fired by accident
  # would log in as the shared staging account behind my back.
  workflow_dispatch:

jobs:
  test:
    # The probe signs in as LOGIN_TEST_USER (slot 1), the same account the
    # chromium suite and manual QA use. It only READS -- signs in, looks at the
    # sidebar -- so it cannot wipe a live run's fixtures the way the notes/tasks
    # beforeAll hooks would. But a concurrent login widens the pre-resolution
    # "Access Denied" window, which would confound slot 1, my control arm.
    concurrency:
      group: playwright-staging-chromium
      cancel-in-progress: false
    # Three logins, at most two 45s waits each. 15 minutes is ample, and a cap
    # this low is deliberate: an unresponsive staging must fail fast here rather
    # than burn the suite's 90-minute budget for no diagnostic.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      LOGIN_PAGE_URL: ${{ secrets.LOGIN_PAGE_URL }}
      # All three pool accounts, under the names the probe reads. The probe never
      # prints a credential -- it reports the VAR NAME that failed.
      LOGIN_TEST_USER: ${{ secrets.LOGIN_TEST_USER }}
      LOGIN_TEST_PASSWORD: ${{ secrets.LOGIN_TEST_PASSWORD }}
      LOGIN_TEST_USER_FIREFOX: ${{ secrets.LOGIN_TEST_USER_FIREFOX }}
      LOGIN_TEST_PASSWORD_FIREFOX: ${{ secrets.LOGIN_TEST_PASSWORD_FIREFOX }}
      LOGIN_TEST_USER_WEBKIT: ${{ secrets.LOGIN_TEST_USER_WEBKIT }}
      LOGIN_TEST_PASSWORD_WEBKIT: ${{ secrets.LOGIN_TEST_PASSWORD_WEBKIT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browser (chromium)
        # chromium only, whichever ACCOUNT is under test: PR #21 hands the
        # firefox/webkit accounts to chromium workers, so the browser is not the
        # variable here -- the account is.
        run: npx playwright install --with-deps chromium
      - name: Probe every pool account
        # pipefail so the step's status is Playwright's, not tee's. continue-on-error
        # because a RED arm is this probe's FINDING, not its failure -- the run must
        # still reach the uploads below, which carry the screenshot and trace that
        # say whether a denial was real or just a pre-resolution frame.
        continue-on-error: true
        run: |
          set -o pipefail
          npx playwright test --config playwright.probe.config.ts 2>&1 | tee probe-run.log
      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-account-access-log
          path: probe-run.log
          retention-days: 30
          if-no-files-found: ignore
      - name: Upload traces & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-account-access-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
