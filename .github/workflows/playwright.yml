name: Playwright Tests

# THIS BRANCH'S COPY IS A PROBE, NOT THE SUITE.
#
# `qa/byw-area-a-probe` answers one question: what does staging's
# build-your-workspace page (workforce/plan) show the shared test account?
# It runs probe/byw-area-a.spec.ts, read-only, instead of the regression suite.
#
# It overwrites playwright.yml because workflow_dispatch only registers
# workflows that exist on the default branch; dispatching with --ref runs this
# branch's copy. Nothing here reaches main: no PR, not merge-intended.
#
#   gh workflow run playwright.yml --ref qa/byw-area-a-probe
#
# -- MeQAtron

on:
  # Manual only, so the probe can never log in as the shared account by accident.
  workflow_dispatch:

jobs:
  test:
    # Same group as earlier probes, so it queues behind any other run that uses it.
    concurrency:
      group: playwright-staging-chromium
      cancel-in-progress: false
    timeout-minutes: 25
    runs-on: ubuntu-latest
    env:
      LOGIN_PAGE_URL: ${{ secrets.LOGIN_PAGE_URL }}
      LOGIN_TEST_USER: ${{ secrets.LOGIN_TEST_USER }}
      LOGIN_TEST_PASSWORD: ${{ secrets.LOGIN_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browser (chromium)
        run: npx playwright install --with-deps chromium
      - name: Probe build-your-workspace (area D)
        run: |
          set -o pipefail
          npx playwright test --config playwright.probe.config.ts probe/byw-area-d4.spec.ts 2>&1 | tee probe-run.log
      - name: Upload probe log and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-byw-area-a
          path: |
            probe-run.log
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
