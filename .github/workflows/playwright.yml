name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Regression run every 6 hours, starting 08:00 PHT (UTC+8).
  # 00:00/06:00/12:00/18:00 UTC == 08:00/14:00/20:00/02:00 PHT.
  schedule:
    - cron: '0 0,6,12,18 * * *'
  # Allow manual, on-demand runs from the Actions tab.
  workflow_dispatch:
    inputs:
      browsers:
        description: 'Browser(s) to run. Automatic runs are always chromium only; this is for one-off cross-engine checks.'
        type: choice
        required: false
        default: chromium
        options:
          - chromium
          - firefox
          - webkit
          - firefox+webkit
          - all

jobs:
  test:
    # Serialise every run that authenticates as the SAME staging account.
    #
    # The env block below already stops two BROWSERS in one run from sharing an
    # account. Nothing stopped two RUNS from doing it: a workflow_dispatch, a
    # PR run and the 6-hourly schedule are all chromium by default, so they all
    # log in as LOGIN_TEST_USER. notes.spec.ts and tasks.spec.ts bulk-clear that
    # account in beforeAll, so an overlapping run wipes the other's fixtures
    # mid-test -- the exact failure the env comment warns about, one level up.
    #
    # Measured before this change: 42 of 291 completed runs (14%) were live
    # while another run was live, including run 34057567384, the run cited as
    # the #23+#24 verification. Concrete instance on 2026-09-15: scheduled run
    # 34926268523 started while dispatch run 34925078198 was 19 minutes in.
    #
    # Keyed on the browser because the browser IS the account (see env below) --
    # a firefox/webkit dispatch uses different credentials and need not queue
    # behind a chromium run. cancel-in-progress stays false: the older run is
    # the one already holding the account and must be allowed to finish.
    concurrency:
      group: playwright-staging-${{ matrix.browser }}
      cancel-in-progress: false
    # Bumped from 30: the suite now runs 67 tests/browser (was ~35) with the
    # addition of tasks.spec.ts (32 tests, each paying its own full
    # login+onboarding cost against a slow staging backend -- see that
    # file's header comment). A live chromium run of just tasks.spec.ts
    # alone took ~33 minutes; 30 minutes total was already tight for the
    # rest of the suite (notes/login/dashboard/pulse) before this addition.
    # webkit is the slowest engine here at ~61min, hence the headroom.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    strategy:
      # One browser failing must not cancel the others -- the whole point of a
      # cross-engine run is to see ALL the engines' results, especially when
      # one of them is red.
      fail-fast: false
      # Automatic triggers (push / pull_request / schedule) carry no inputs, so
      # this collapses to chromium alone -- the browser matrix was removed from
      # automatic runs by request (Earl Dominic, 2026-07-31).
      #
      # The evidence backed that: on run 30323518312, where all three shards
      # ran the same suite, firefox and webkit surfaced no product bug chromium
      # missed (webkit's 2 failures were teardown/timeout artifacts, not engine
      # behaviour), while webkit took 61min against chromium's 37min. Every run
      # waited on the slowest, least informative shard.
      #
      # What that trade-off costs, and why this input exists: chromium-only CI
      # cannot see a firefox/webkit-only defect AT ALL. TM2-T003 (notes
      # clear-title) is exactly that shape -- in run 30574845877 it failed ONLY
      # on firefox and webkit, so chromium-only CI reports green while the bug
      # is still live. Use workflow_dispatch with this input to check the other
      # engines deliberately, instead of paying for a permanent 3x fan-out.
      matrix:
        browser: ${{ fromJSON(
          inputs.browsers == 'all' && '["chromium","firefox","webkit"]'
          || inputs.browsers == 'firefox+webkit' && '["firefox","webkit"]'
          || inputs.browsers == 'firefox' && '["firefox"]'
          || inputs.browsers == 'webkit' && '["webkit"]'
          || '["chromium"]') }}
    env:
      LOGIN_PAGE_URL: ${{ secrets.LOGIN_PAGE_URL }}
      # Each browser authenticates as its OWN dedicated staging account, so
      # concurrent shards never mutate each other's data (notes.spec.ts and
      # tasks.spec.ts bulk-clear their account in beforeAll -- two browsers
      # sharing one account would wipe each other's fixtures mid-run).
      #
      # This matters OUTSIDE CI too: LOGIN_TEST_USER is the same staging
      # account used for manual browser QA, so a manual session and an
      # in-flight chromium run corrupt each other. Check `gh run list` before
      # doing manual QA against staging.
      LOGIN_TEST_USER: ${{ matrix.browser == 'firefox' && secrets.LOGIN_TEST_USER_FIREFOX || matrix.browser == 'webkit' && secrets.LOGIN_TEST_USER_WEBKIT || secrets.LOGIN_TEST_USER }}
      LOGIN_TEST_PASSWORD: ${{ matrix.browser == 'firefox' && secrets.LOGIN_TEST_PASSWORD_FIREFOX || matrix.browser == 'webkit' && secrets.LOGIN_TEST_PASSWORD_WEBKIT || secrets.LOGIN_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run Playwright tests
        # pipefail so the step's exit status is Playwright's, not tee's -- without
        # it a failing suite would report success. The `list` reporter prints
        # incrementally, so test-run.log survives the SIGKILL that ends a capped
        # run, and its LAST LINE names the spec that was still in flight when the
        # clock ran out. That is the one diagnostic the HTML report cannot give.
        run: |
          set -o pipefail
          npx playwright test --project=${{ matrix.browser }} 2>&1 | tee test-run.log
      - name: Upload Playwright report
        # Always keep the report on scheduled/manual runs (for the nightly record),
        # and on any failed push/PR run.
        #
        # `!cancelled()` was the one case that mattered and the one case it
        # skipped. Since 2026-09-10 every scheduled run has hit the 90-minute
        # timeout-minutes cap, which GitHub reports as `cancelled` -- so 39
        # consecutive runs (~58 hours of CI) uploaded NOTHING and TM2-T019 had
        # to be diagnosed without a single artifact.
        #
        # HONEST SCOPE (measured, probe run 34928196365): on a CAPPED run this
        # step now fires but still uploads nothing -- the html reporter writes
        # playwright-report/ in onEnd(), which a killed run never reaches, so
        # the directory is absent. Keep always() anyway: it is correct for every
        # non-capped run. The artifacts that actually survive a cap are the two
        # steps below. `if-no-files-found: warn` is deliberate -- a green upload
        # step is NOT proof an artifact exists, and the warning is the only
        # in-run signal that this one came back empty.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload failure screenshots & videos
        # Raw per-test screenshots, videos, and traces for quick access without
        # opening the full HTML report.
        #
        # THIS is the step that recovers a capped run. Measured on probe run
        # 34928196365: at cancel time test-results/ was fully POPULATED (4
        # per-test dirs + .playwright-artifacts-5), holding the traces from
        # use.trace='retain-on-failure' -- the richest diagnostic in the repo.
        # It was discarded solely because this guard was `if: failure()`, and
        # failure() is FALSE on a run GitHub reports as `cancelled`. One word.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
      - name: Upload run log
        # Cheap human-readable index of a run, and the only artifact that is
        # guaranteed to exist after a cap (tee writes it line by line).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-run-log-${{ matrix.browser }}
          path: test-run.log
          retention-days: 30
          if-no-files-found: ignore
