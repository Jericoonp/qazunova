name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Regression run every 6 hours, starting 08:00 PHT (UTC+8).
  # 00:00/06:00/12:00/18:00 UTC == 08:00/14:00/20:00/02:00 PHT.
  schedule:
    - cron: '0 0,6,12,18 * * *'
  # Allow manual, on-demand runs from the Actions tab.
  workflow_dispatch:

jobs:
  test:
    # Bumped from 30: the suite now runs 67 tests/browser (was ~35) with the
    # addition of tasks.spec.ts (32 tests, each paying its own full
    # login+onboarding cost against a slow staging backend -- see that
    # file's header comment). A live chromium run of just tasks.spec.ts
    # alone took ~33 minutes; 30 minutes total was already tight for the
    # rest of the suite (notes/login/dashboard/pulse) before this addition.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    # Chromium only -- the browser matrix was removed by request (Earl Dominic,
    # 2026-07-31). Runs no longer fan out into three parallel browser shards.
    #
    # The evidence backs it: on run 30323518312, where all three shards ran the
    # same suite, firefox and webkit surfaced no product bug chromium missed
    # (webkit's 2 failures were teardown/timeout artifacts, not engine
    # behaviour), while webkit took 61min against chromium's 37min. Every run
    # waited on the slowest, least informative shard.
    #
    # To restore a browser, add a strategy.matrix back here AND its project
    # block in playwright.config.ts -- both must change together, and it needs
    # its own dedicated staging account (see LOGIN_TEST_USER below).
    env:
      LOGIN_PAGE_URL: ${{ secrets.LOGIN_PAGE_URL }}
      # Shards used to authenticate as one dedicated staging account each, so
      # they never mutated each other's data (notes.spec.ts bulk-clears its
      # account's notes in beforeAll). With a single chromium job there is
      # nothing to race, so the per-browser accounts are no longer wired up --
      # the LOGIN_TEST_USER_FIREFOX / _WEBKIT secrets still exist in the repo
      # if a shard is ever restored.
      LOGIN_TEST_USER: ${{ secrets.LOGIN_TEST_USER }}
      LOGIN_TEST_PASSWORD: ${{ secrets.LOGIN_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browser (chromium)
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test --project=chromium
      - name: Upload Playwright report
        # Always keep the report on scheduled/manual runs (for the nightly record),
        # and on any failed push/PR run.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: playwright-report/
          retention-days: 30
      - name: Upload failure screenshots & videos
        # Raw per-test screenshots, videos, and traces for quick access without
        # opening the full HTML report.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-chromium
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
