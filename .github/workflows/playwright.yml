name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      LOGIN_PAGE_URL: ${{ secrets.LOGIN_PAGE_URL }}
      LOGIN_TEST_USER: ${{ secrets.LOGIN_TEST_USER }}
      LOGIN_TEST_PASSWORD: ${{ secrets.LOGIN_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Compute Notes auth-state cache date
        id: notes-auth-cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore Notes auth state
        uses: actions/cache@v4
        with:
          path: playwright/.auth
          key: notes-auth-${{ steps.notes-auth-cache-date.outputs.date }}
          restore-keys: |
            notes-auth-
      - name: Run Playwright tests
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
